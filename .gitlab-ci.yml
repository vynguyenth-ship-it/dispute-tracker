stages:
  - build

variables:
  AGENT_NAME: "gmail-classifier"
  PALANA_IN_CLUSTER: "true"

build_image:
  stage: build
  image: docker-registry.gitlab.myteksi.net/library/docker:latest
  services:
    - name: docker-registry.gitlab.myteksi.net/library/docker:dind
      alias: docker
  before_script:
    - apk add --no-cache curl bash aws-cli jq python3 openssl kubectl
    - mkdir -p ~/.palana
    - echo "${PALANA_KUBECONFIG}" | base64 -d > ~/.palana/kubeconfig
    - curl -sSL -o pcli https://portal.agent.palana.engtools.net/portal/pcli && chmod +x pcli
    - ./pcli preflight
  script:
    - ./pcli rebuild ${AGENT_NAME} -f Dockerfile . --template build/user-manifests/gmail-classifier.yaml
  only:
    - master
