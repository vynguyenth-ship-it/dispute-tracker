stages:
  - build
  - deploy


variables:
  AGENT_NAME: "gmail-classifier"

build_image:
  stage: build
  image: docker-registry.gitlab.myteksi.net/library/docker:latest
  services:
    - name: docker-registry.gitlab.myteksi.net/library/docker:dind
      alias: docker
  before_script:
    - curl -sSL -o pcli https://portal.agent.palana.engtools.net/portal/pcli && chmod +x pcli
    - ./pcli preflight
  script:
    - ./pcli rebuild ${AGENT_NAME} -f Dockerfile .
  only:
    - main

deploy_agent:
  stage: deploy
  image: docker-registry.gitlab.myteksi.net/library/alpine:latest
  before_script:
    - apk add --no-cache curl bash
    - curl -sSL -o pcli https://portal.agent.palana.engtools.net/portal/pcli && chmod +x pcli
    - ./pcli preflight
  script:
    - ./pcli create ${AGENT_NAME} 250 256 || true
    - ./pcli run ${AGENT_NAME} --port 8080 --run-as-user 1000 --fs-group 1000 --replace
  only:
    - main
